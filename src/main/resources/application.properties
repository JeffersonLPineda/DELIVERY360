spring.application.name=smartdelivery360

server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5434/smartdelivery}
spring.datasource.username=${DB_USER:Admin}
spring.datasource.password=${DB_PASSWORD:Admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.region-code=${GOOGLE_MAPS_REGION:gt}

# API p\u00c3\u00bablica (/api/v1/public): l\u00c3\u00admites por IP y or\u00c3\u00adgenes CORS permitidos (separados por coma; * = cualquiera)
api.publica.limite-por-minuto=${API_PUBLICA_LIMITE:120}
api.publica.limite-seguimiento-por-minuto=${API_PUBLICA_LIMITE_SEGUIMIENTO:15}
api.publica.origenes-permitidos=${API_PUBLICA_ORIGENES:*}
