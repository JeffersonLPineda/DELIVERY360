# Ejecutar con: --spring.profiles.active=h2   (solo para pruebas rápidas sin instalar PostgreSQL; guarda en ./data)
spring.datasource.url=jdbc:h2:file:./data/smartdelivery;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
